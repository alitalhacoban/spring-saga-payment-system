server.port=8083

spring.application.name=inventory-service

# Datasource
spring.datasource.url=jdbc:postgresql://localhost:5434/inventory_db
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=validate

# Liquibase
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.xml
spring.liquibase.enabled=true
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Kafka
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.properties.spring.json.add.type.headers=true
spring.kafka.consumer.group-id=inventory-service-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=*

# gRPC server
grpc.server.port=9083

# gRPC clients
grpc.client.payment-service.address=static://localhost:9081
grpc.client.payment-service.negotiation-type=plaintext
grpc.client.order-service.address=static://localhost:9082
grpc.client.order-service.negotiation-type=plaintext
grpc.client.saga-orchestrator.address=static://localhost:9084
grpc.client.saga-orchestrator.negotiation-type=plaintext

# Actuator
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always

# Logging
logging.level.com.saga.inventory=DEBUG
logging.level.org.springframework.kafka=INFO
