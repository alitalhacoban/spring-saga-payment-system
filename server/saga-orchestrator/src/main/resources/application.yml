server:
  port: 8084

spring:
  application:
    name: saga-orchestrator

  datasource:
    url: jdbc:postgresql://localhost:5435/orchestrator_db
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.add.type.headers: false
    consumer:
      group-id: saga-orchestrator-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "*"

# gRPC server port for this service
grpc:
  server:
    port: 9084
  # gRPC clients pointing to other services (orchestrator calls all services)
  client:
    payment-service:
      address: static://localhost:9081
      negotiation-type: plaintext
    order-service:
      address: static://localhost:9082
      negotiation-type: plaintext
    inventory-service:
      address: static://localhost:9083
      negotiation-type: plaintext

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.saga.orchestrator: DEBUG
    org.springframework.kafka: INFO
