="muted" >commands ↓   events ↑</text><line x1="160" y1="283" x2="160" y2="334" class="ln" marker-start="url(#ah)" marker-end="url(#ah)"/><text x="172" y="313" font-size="12" text-anchor="start" class="mono muted" >order.*</text><rect x="50" y="337" width="220" height="108" rx="12" class="s-order"/><text x="160.0" y="367" font-size="17" text-anchor="middle" class="b t-order" >Order Service</text><text x="160.0" y="389" font-size="12.5" text-anchor="middle" class="mono muted" >REST :8082 · gRPC :9082</text><rect x="131.0" y="411" width="58.0" height="20" rx="10" class="badge" style="stroke:var(--order)"/><text x="160.0" y="425" font-size="11.5" text-anchor="middle" class="t-order" >outbox</text><line x1="160" y1="447" x2="160" y2="486" class="ln-muted"/><path class="db" d="M85.0,495 v54 a75.0,9 0 0 0 150,0 v-54"/><ellipse class="db" cx="160" cy="495" rx="75.0" ry="9"/><text x="160" y="522" font-size="12.5" text-anchor="middle" class="mono b" >order_db</text><text x="160" y="540" font-size="11.5" text-anchor="middle" class="muted" >PostgreSQL :5433</text><line x1="420" y1="283" x2="420" y2="334" class="ln" marker-start="url(#ah)" marker-end="url(#ah)"/><text x="432" y="313" font-size="12" text-anchor="start" class="mono muted" >payment.*</text><rect x="310" y="337" width="220" height="108" rx="12" class="s-pay"/><text x="420.0" y="367" font-size="17" text-anchor="middle" class="b t-pay" >Payment Service</text><text x="420.0" y="389" font-size="12.5" text-anchor="middle" class="mono muted" >REST :8081 · gRPC :9081</text><rect x="321.3" y="411" width="58.0" height="20" rx="10" class="badge" style="stroke:var(--pay)"/><text x="350.3" y="425" font-size="11.5" text-anchor="middle" class="t-pay" >outbox</text><rect x="387.3" y="411" width="131.4" height="20" rx="10" class="badge" style="stroke:var(--pay)"/><text x="453.0" y="425" font-size="11.5" text-anchor="middle" class="t-pay" >simulated gateway</text><line x1="420" y1="447" x2="420" y2="486" class="ln-muted"/><path class="db" d="M345.0,495 v54 a75.0,9 0 0 0 150,0 v-54"/><ellipse class="db" cx="420" cy="495" rx="75.0" ry="9"/><text x="420" y="522" font-size="12.5" text-anchor="middle" class="mono b" >payment_db</text><text x="420" y="540" font-size="11.5" text-anchor="middle" class="muted" >PostgreSQL :5436</text><line x1="680" y1="283" x2="680" y2="334" class="ln" marker-start="url(#ah)" marker-end="url(#ah)"/><text x="692" y="313" font-size="12" text-anchor="start" class="mono muted" >stock.*</text><rect x="570" y="337" width="220" height="108" rx="12" class="s-inv"/><text x="680.0" y="367" font-size="17" text-anchor="middle" class="b t-inv" >Inventory Service</text><text x="680.0" y="389" font-size="12.5" text-anchor="middle" class="mono muted" >REST :8083 · gRPC :9083</text><rect x="584.6" y="411" width="58.0" height="20" rx="10" class="badge" style="stroke:var(--inv)"/><text x="613.6" y="425" font-size="11.5" text-anchor="middle" class="t-inv" >outbox</text><rect x="650.6" y="411" width="124.7" height="20" rx="10" class="badge" style="stroke:var(--inv)"/><text x="713.0" y="425" font-size="11.5" text-anchor="middle" class="t-inv" >pessimistic lock</text><line x1="680" y1="447" x2="680" y2="486" class="ln-muted"/><path class="db" d="M605.0,495 v54 a75.0,9 0 0 0 150,0 v-54"/><ellipse class="db" cx="680" cy="495" rx="75.0" ry="9"/><text x="680" y="522" font-size="12.5" text-anchor="middle" class="mono b" >inventory_db</text><text x="680" y="540" font-size="11.5" text-anchor="middle" class="muted" >PostgreSQL :5434</text><path class="ln-grpc" d="M612,138 H860 V391 H795" marker-end="url(#ah-grpc)"/><text x="878" y="265" font-size="12" text-anchor="middle" class="t-grpc b" transform="rotate(90 878 265)">gRPC · CheckStock / GetProduct (sync)</text><text x="465.0" y="600" font-size="12.5" text-anchor="middle" class="muted" >Each service owns its database exclusively — cross-service traffic only via Kafka (async) or gRPC (sync lookups)</text></svg>