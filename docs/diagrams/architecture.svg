<svg xmlns="http://www.w3.org/2000/svg" width="930" height="630" viewBox="0 0 930 630" role="img" aria-labelledby="t d"><title id="t">Saga Pattern Payment System architecture</title><desc id="d">Client calls the Saga Orchestrator over REST. The orchestrator exchanges commands and events with Order, Payment and Inventory services through Kafka, and does synchronous gRPC lookups against Inventory. Each service owns its own PostgreSQL database.</desc>
<style>
svg{
 --bg:#ffffff;--text:#1f2328;--muted:#59636e;--line:#424a53;--band:#f6f8fa;--band-stroke:#d1d9e0;
 --orch:#8250df;--orch-bg:#fbefff;--order:#0969da;--order-bg:#ddf4ff;
 --inv:#1a7f37;--inv-bg:#dafbe1;--pay:#bc4c00;--pay-bg:#fff1e5;
 --client:#59636e;--client-bg:#f6f8fa;--kafka:#24292f;--kafka-text:#ffffff;--kafka-muted:#d1d9e0;
 --db:#f6f8fa;--db-stroke:#8c959f;--red:#cf222e;--red-bg:#ffebe9;--green:#1a7f37;--green-bg:#dafbe1;--grpc:#9a6700;
}
@media (prefers-color-scheme: dark){svg{
 --bg:#0d1117;--text:#e6edf3;--muted:#9198a1;--line:#b7bdc8;--band:#151b23;--band-stroke:#3d444d;
 --orch:#a371f7;--orch-bg:#271c3d;--order:#4493f8;--order-bg:#0f2540;
 --inv:#3fb950;--inv-bg:#0f2a1a;--pay:#db6d28;--pay-bg:#2e1c10;
 --client:#9198a1;--client-bg:#151b23;--kafka:#2f363f;--kafka-text:#f0f6fc;--kafka-muted:#9198a1;
 --db:#151b23;--db-stroke:#6e7681;--red:#f85149;--red-bg:#3a1618;--green:#3fb950;--green-bg:#0f2a1a;--grpc:#d29922;
}}
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;fill:var(--text)}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.muted{fill:var(--muted)} .b{font-weight:700} .bg{fill:var(--bg)}
.ln{stroke:var(--line);stroke-width:2;fill:none}
.ln-muted{stroke:var(--db-stroke);stroke-width:1.5;fill:none}
.ln-red{stroke:var(--red);stroke-width:2;fill:none} .ln-grpc{stroke:var(--grpc);stroke-width:2;fill:none}
.dash{stroke-dasharray:7 5} .life{stroke:var(--db-stroke);stroke-width:1.5;stroke-dasharray:4 5}
.mk{fill:var(--line)} .mk-red{fill:var(--red)} .mk-grpc{fill:var(--grpc)}
.t-red{fill:var(--red)} .t-grpc{fill:var(--grpc)} .t-green{fill:var(--green)}
.band{fill:var(--band);stroke:var(--band-stroke)}
.db{fill:var(--db);stroke:var(--db-stroke);stroke-width:1.5}
.kafka{fill:var(--kafka)} .t-kafka{fill:var(--kafka-text)} .t-kafka-muted{fill:var(--kafka-muted)}
.s-orch{fill:var(--orch-bg);stroke:var(--orch);stroke-width:2} .t-orch{fill:var(--orch)}
.s-order{fill:var(--order-bg);stroke:var(--order);stroke-width:2} .t-order{fill:var(--order)}
.s-inv{fill:var(--inv-bg);stroke:var(--inv);stroke-width:2} .t-inv{fill:var(--inv)}
.s-pay{fill:var(--pay-bg);stroke:var(--pay);stroke-width:2} .t-pay{fill:var(--pay)}
.s-client{fill:var(--client-bg);stroke:var(--client);stroke-width:2} .t-client{fill:var(--client)}
.st-ok{fill:var(--green-bg);stroke:var(--green);stroke-width:1.5}
.st-fail{fill:var(--red-bg);stroke:var(--red);stroke-width:1.5}
.badge{fill:var(--bg);stroke-width:1.2}
</style>

<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="mk" d="M0,0 L10,5 L0,10 z"/></marker>
 <marker id="ah-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="mk-red" d="M0,0 L10,5 L0,10 z"/></marker>
 <marker id="ah-grpc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="mk-grpc" d="M0,0 L10,5 L0,10 z"/></marker>
</defs>
