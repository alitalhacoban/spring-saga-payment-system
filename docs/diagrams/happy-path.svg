 --client:#9198a1;--client-bg:#151b23;--kafka:#2f363f;--kafka-text:#f0f6fc;--kafka-muted:#9198a1;
 --db:#151b23;--db-stroke:#6e7681;--red:#f85149;--red-bg:#3a1618;--green:#3fb950;--green-bg:#0f2a1a;--grpc:#d29922;
}}
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;fill:var(--text)}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.muted{fill:var(--muted)} .b{font-weight:700} .bg{fill:var(--bg)}
.ln{stroke:var(--line);stroke-width:2;fill:none}
.ln-muted{stroke:var(--db-stroke);stroke-width:1.5;fill:none}
.ln-red{stroke:var(--red);stroke-width:2;fill:none} .ln-grpc{stroke:var(--grpc);stroke-width:2;fill:none}
.dash{stroke-dasharray:7 5} .life{stroke:var(--db-stroke);stroke-width:1.5;stroke-dasharray:4 5}
.mk{fill:var(--line)} .mk-red{fill:var(--red)} .mk-grpc{fill:var(--grpc)}
.t-red{fill:var(--red)} .t-grpc{fill:var(--grpc)} .t-green{fill:var(--green)}
.band{fill:var(--band);stroke:var(--band-stroke)}
.db{fill:var(--db);stroke:var(--db-stroke);stroke-width:1.5}
.kafka{fill:var(--kafka)} .t-kafka{fill:var(--kafka-text)} .t-kafka-muted{fill:var(--kafka-muted)}
.s-orch{fill:var(--orch-bg);stroke:var(--orch);stroke-width:2} .t-orch{fill:var(--orch)}
.s-order{fill:var(--order-bg);stroke:var(--order);stroke-width:2} .t-order{fill:var(--order)}
.s-inv{fill:var(--inv-bg);stroke:var(--inv);stroke-width:2} .t-inv{fill:var(--inv)}
.s-pay{fill:var(--pay-bg);stroke:var(--pay);stroke-width:2} .t-pay{fill:var(--pay)}
.s-client{fill:var(--client-bg);stroke:var(--client);stroke-width:2} .t-client{fill:var(--client)}
.st-ok{fill:var(--green-bg);stroke:var(--green);stroke-width:1.5}
.st-fail{fill:var(--red-bg);stroke:var(--red);stroke-width:1.5}
.badge{fill:var(--bg);stroke-width:1.2}
</style>

<defs>
